name: Build UEFI for fuxi

on:
  workflow_dispatch:
    inputs:
      unixnu_repo:
        description: "UniXNU core repository (provides package/UniXNUPkg and drivers/DarwinBoot)"
        default: "matejkoo217/UniXNU"
        required: true

env:
  CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone the UniXNU core with its driver submodules
        run: |
          set -euo pipefail
          target="$(dirname "$GITHUB_WORKSPACE")/UniXNU"
          rm -rf "$target"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            "https://github.com/${{ inputs.unixnu_repo }}.git" "$target"
          echo "UNIXNU_ROOT=$target" >> "$GITHUB_ENV"
          ls "$target/package" | head
          ls "$target/drivers/DarwinBoot" | head

      - name: Teach fuxiPkg where the driver packages live
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Platforms/Xiaomi/fuxiPkg/DeviceBuild.py")
          s = p.read_text()
          needle = '"Silicium-ACPI/Silicon/Qualcomm"'
          if needle not in s:
              raise SystemExit("PackagesPath tail not found")
          root = 'os.environ.get("UNIXNU_ROOT", os.path.join(WorkspaceRoot, "..", "UniXNU"))'
          s = s.replace(needle, needle + ',\n os.path.join(' + root + ', "drivers", "DarwinBoot")', 1)
          p.write_text(s)
          print("\n".join(l for l in s.splitlines() if "DarwinBoot" in l or "Qualcomm" in l))
          PY

      - name: Install build environment (targeted, no full-upgrade)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm acpica-tools \
            python3 python3-pip python3-venv python3-dev \
            git clang llvm lld gcc-aarch64-linux-gnu \
            gettext locales gnupg ca-certificates curl libssl-dev pkg-config \
            mono-devel unzip
          sudo locale-gen en_US.UTF-8 || true
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r pip-requirements.txt
          echo "--- toolchain ---"
          clang --version | head -1
          nasm -v
          iasl -v 2>&1 | head -2
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build UEFI for fuxi
        run: ./build_uefi.py -d fuxi -r DEBUG -c -m 0

      - name: Collect images
        if: always()
        run: |
          echo "--- artefacts ---"
          ls -la Mu-* 2>/dev/null || echo "no Mu-* produced"
          find . -maxdepth 4 -name '*.fd' | head -20

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uefi-fuxi
          path: |
            Mu-*
            **/*.fd
          compression-level: 9
          if-no-files-found: warn
