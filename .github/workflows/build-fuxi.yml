name: Build UEFI for fuxi

on:
  workflow_dispatch:
    inputs:
      unixnu_repo:
        description: "UniXNU core repository (provides package/UniXNUPkg and drivers/DarwinBoot)"
        default: "matejkoo217/UniXNU"
        required: true

env:
  CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone the UniXNU core with its driver submodules
        run: |
          set -euo pipefail
          target="$(dirname "$GITHUB_WORKSPACE")/UniXNU"
          rm -rf "$target"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            "https://github.com/${{ inputs.unixnu_repo }}.git" "$target"
          echo "UNIXNU_ROOT=$target" >> "$GITHUB_ENV"
          echo "--- core package/ ---"
          ls "$target/package"
          echo "--- drivers/DarwinBoot ---"
          ls "$target/drivers/DarwinBoot" | head -20

      - name: Teach fuxiPkg where the driver packages live
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("Platforms/Xiaomi/fuxiPkg/DeviceBuild.py")
          s = p.read_text()
          needle = '"Silicium-ACPI/Silicon/Qualcomm"'
          if needle not in s:
              raise SystemExit("PackagesPath tail not found")
          root = 'os.environ.get("UNIXNU_ROOT", os.path.join(WorkspaceRoot, "..", "UniXNU"))'
          extra = ',\n ' + root + ', "drivers", "DarwinBoot"'
          s = s.replace(needle, needle + extra, 1)
          p.write_text(s)
          print("patched PackagesPath:")
          for line in s.splitlines():
              if "DarwinBoot" in line or "Qualcomm" in line:
                  print("   ", line.strip())
          PY

      - name: Show fuxi platform presence
        run: |
          ls -la Platforms/Xiaomi/fuxiPkg
          ls -la Platforms/Xiaomi/fuxiPkg/FdtBlob

      - name: Install build environment
        run: bash ./setup_env.sh -p apt

      - name: Build UEFI for fuxi
        run: ./build_uefi.py -d fuxi -r DEBUG -c -m 0

      - name: Collect images
        if: always()
        run: |
          echo "--- artefacts ---"
          ls -la Mu-* 2>/dev/null || echo "no Mu-* produced"
          find . -maxdepth 4 -name '*.fd' | head -20

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uefi-fuxi
          path: |
            Mu-*
            **/*.fd
          compression-level: 9
          if-no-files-found: warn
